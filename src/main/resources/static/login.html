<!doctype html>
<html lang="en">
<head>
<title>Log in · PantryPal</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/art.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
</head>
<body>
<div class="auth">
  <aside class="auth-art"><div class="scene" id="authScene"></div></aside>
  <main class="auth-main">
    <div class="auth-box">
      <a class="brand" href="/index.html" id="brand" style="margin-bottom:24px"></a>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabLogin" aria-selected="true" aria-controls="loginForm">Log in</button>
        <button role="tab" id="tabRegister" aria-selected="false" aria-controls="registerForm">Create account</button>
      </div>

      <form id="loginForm" novalidate>
        <h1>Welcome back!</h1>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn coral big" type="submit">Log in</button>
        <div class="demo-hint">Just looking? <button type="button" id="useDemo">Fill in the demo account</button> (demo@pantrypal.app / Demo1234)</div>
      </form>

      <form id="registerForm" hidden novalidate>
        <h1>Open your kitchen</h1>
        <label>Your name<input name="displayName" autocomplete="name" required maxlength="60"></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" required maxlength="72">
          <ul class="pw-rules" id="pwRules"><li data-r="len">8+ characters</li><li data-r="let">a letter</li><li data-r="num">a number</li></ul>
        </label>
        <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required></label>
        <button class="btn coral big" type="submit">Create account</button>
      </form>
    </div>
  </main>
</div>
<script src="/js/pages/login.js"></script>
</body>
</html>
