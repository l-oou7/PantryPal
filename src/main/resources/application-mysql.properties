# ---------- MySQL profile ----------
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# (NetBeans: Project Properties > Run > VM Options:  -Dspring.profiles.active=mysql)
# The database is created automatically. Set DB_PASSWORD (and DB_USERNAME if not root),
# or change the default after the colon below.
# On a cloud host, set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pantrypal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
