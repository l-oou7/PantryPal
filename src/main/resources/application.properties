spring.application.name=PantryPal
server.port=${PORT:8080}

# ---------- Database ----------
# Default: H2, a database built into the app. No installation and no password needed.
# Data is saved in the "data" folder inside the project, so it survives restarts.
# To use MySQL instead, activate the "mysql" profile (see application-mysql.properties).
spring.datasource.url=jdbc:h2:file:./data/pantrypal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate keeps the tables in sync with the entities. The equivalent hand-written
# MySQL DDL lives in database/schema.sql for documentation and manual setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------- Sessions ----------
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- PantryPal ----------
# Expiry scanner: every hour on the hour (also runs once at startup)
pantrypal.expiry.cron=0 0 * * * *
# Default "expiring soon" window in days (each user can change theirs in Profile)
pantrypal.expiry.default-threshold-days=3
pantrypal.pantry.max-items=200
pantrypal.currency=AED
# Seed recipes and demo accounts on first start
pantrypal.seed.enabled=true
